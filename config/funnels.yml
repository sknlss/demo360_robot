# Конфиг воронок. Ключ воронки -> её описание.
# Ссылка t.me/<бот>?start=<ключ> выбирает воронку; без параметра — settings.default_funnel.
# Длительности: число секунд или строка 10s / 1m / 1h.

settings:
  default_funnel: signup
  stale_after: 5m      # сообщение, опоздавшее больше чем на это, не отправляется, а помечается просроченным
  send_pause: 0.1s     # пауза между отправками (лимиты Telegram)
  max_attempts: 3      # попыток отправки при временных ошибках
  retry_delay: 5s      # пауза перед повтором при временной ошибке

funnels:
  signup:
    # Воронка — один список шагов, начало всегда «Триггер: /start». Шаг опознаётся по key, kind — его вид.
    # Планируется только следующий шаг, после отправки предыдущего.
    #   message   — сообщение. request_phone: шаг просит номер (кнопка запроса контакта и кнопка отказа);
    #               воронку это не останавливает: следующие шаги идут дальше, пока человек не ответит.
    #               on_reply: куда идти после ответа (contact — прислал номер, decline — отказ: кнопкой
    #               или любым текстом). Ответ отменяет ждущие шаги и ставит указанный шаг.
    #               next: явный следующий шаг или end.
    #   delay     — пауза duration, потом следующий шаг по списку. Сама ничего не отправляет.
    #   condition — проверка check и два выхода on_true / on_false, оба обязательны. Выход:
    #               next (следующий по списку) | end (закончить прогон) | ключ шага.
    #               Условие ничего не отправляет и в очередь не встаёт: бот вычисляет его сразу и идёт дальше.
    # «Следующий по списку» у сообщения и задержки не проваливается в шаги, куда ведут on_reply и выходы
    # условий: после напоминаний прогон кончается, а не падает в «спасибо». Явный end в таких шагах — для читателя.
    steps:
      # Уже оставил номер в этой воронке? Да — сообщаем, что заявка у менеджера, и конец. Нет — идём по списку.
      # Тот, у кого напоминания кончились без ответа, или тот, кто отказался, номера не оставил и начинает заново.
      - key: has_phone
        kind: condition
        check:
          kind: phone_given
        on_true: already
        on_false: next

      - key: welcome
        kind: message
        text: "Привет! Это бот записи на консультацию."

      - key: ask_phone
        kind: message
        text: "Оставьте номер телефона, и менеджер свяжется с вами. Нажмите кнопку «Поделиться номером» ниже."
        request_phone:
          button: "📱 Поделиться номером"
          decline_button: "Не хочу делиться"
        on_reply:
          contact: thanks
          decline: declined

      - key: wait_1
        kind: delay
        duration: 10s

      - key: reminder_1
        kind: message
        text: "Мы всё ещё ждём ваш номер. Нажмите кнопку ниже «Поделиться номером» — это займёт секунду."

      - key: wait_2
        kind: delay
        duration: 1m

      - key: reminder_2
        kind: message
        text: "Последнее напоминание: без номера мы не сможем оформить заявку. Нажмите кнопку ниже, если хотите, чтобы менеджер вам позвонил."
        next: end

      # Ниже — шаги, в которые ведут выход условия и on_reply; по списку на них не попадают.
      - key: already
        kind: message
        text: "Ваша заявка уже у менеджера, ждите — он свяжется с вами."
        next: end

      - key: thanks
        kind: message
        text: "Спасибо, заявка принята! Менеджер свяжется с вами в ближайшее время."
        next: end

      - key: declined
        kind: message
        text: "Хорошо, без номера. Если понадобится помощь — напишите нам сюда."
        next: end
